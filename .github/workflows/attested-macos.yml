# Attested macOS build of darktable — experiment on a personal fork.
#
# Phase 1: the upstream nightly macOS job with every build step wrapped by the
# cilock CLI. Each step produces one signed record and uploads it to the
# TestifySec platform. Signing is keyless: inside GitHub Actions, cilock's
# Fulcio signer fetches this workflow's OIDC token itself, and Archivista
# upload auth uses the same OIDC identity (trusted with `cilock trust github`).
#
# Uses the CLI directly rather than aflock-ai/cilock-action: v4.x tags have no
# release binaries (404) and v3.0.8's shim fails on Node 24 (MODULE_NOT_FOUND).
# The CLI is also exactly what a Jenkins / TeamCity agent would run.
#
# Baseline (phase 0, no attestation): run 36046970463, 26m 13s total.
# Runs only on pushes to `attested-build` or by hand. Never touches tags or releases.

name: attested-macos

on:
  push:
    branches: [attested-build]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # keyless signing + platform upload with the workflow's OIDC token

jobs:
  macos:
    name: macOS arm64 (attested)
    runs-on: macos-15
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CC: cc
      CXX: c++
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      SRC_DIR: ${{ github.workspace }}/src
      BUILD_DIR: ${{ github.workspace }}/src/build
      INSTALL_PREFIX: ${{ github.workspace }}/src/build/macosx
      ECO: -DBINARY_PACKAGE_BUILD=ON -DBUILD_CURVE_TOOLS=ON -DBUILD_NOISE_TOOLS=ON -DUSE_GRAPHICSMAGICK=ON -DUSE_IMAGEMAGICK=OFF
      CMAKE_BUILD_TYPE: Release
      GENERATOR: Ninja
      TARGET: skiptest
      CILOCK_SKIP_VERSION_CHECK: "1"
      # Same attestors on every step; extras are appended per step.
      ATTESTORS: environment,git,github
      # --no-product-binding on every run: the hosted platform returns 401 on
      # /api/auth/resolve-binding for this repo's workflow login token (see plan log).
      EVID: ${{ github.workspace }}/evidence
    steps:
      - name: install cilock
        run: |
          mkdir -p "$HOME/.local/bin" "$EVID"
          curl -fsSL https://cilock.dev/install.sh | CILOCK_BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cilock" version

      # The clone itself cannot be attested by the git attestor (no repo exists
      # until it finishes). Every later step records the commit it built from.
      - name: clone
        run: git clone -b ${{ github.ref_name }} https://github.com/${{ github.repository }} src

      - name: source
        working-directory: src
        run: cilock run --no-product-binding --enable-archivista --step source -a "$ATTESTORS" -o "$EVID/source.att.json" -- bash .attest/source.sh

      - name: deps
        working-directory: src
        run: cilock run --no-product-binding --enable-archivista --step deps -a "$ATTESTORS" -o "$EVID/deps.att.json" -- bash .attest/deps.sh

      - name: build
        working-directory: src
        run: mkdir -p "$BUILD_DIR" "$INSTALL_PREFIX" && cilock run --no-product-binding --enable-archivista --step build -a "$ATTESTORS" -o "$EVID/build.att.json" -- ./.ci/ci-script.sh

      - name: app-bundle
        working-directory: src
        run: cilock run --no-product-binding --enable-archivista --step app-bundle -a "$ATTESTORS" -o "$EVID/app-bundle.att.json" -- ./packaging/macosx/3_make_hb_darktable_package.sh

      - name: dmg
        working-directory: src
        run: cilock run --no-product-binding --enable-archivista --step dmg -a "$ATTESTORS" -o "$EVID/dmg.att.json" -- ./packaging/macosx/4_make_hb_darktable_dmg.sh

      - name: locate dmg
        working-directory: src
        run: |
          VERSION=$(git describe --tags --match release-* | sed 's/^release-//;s/-/+/;s/-/~/;s/rc/~rc/')
          DMG="${INSTALL_PREFIX}/darktable-${VERSION}-$(uname -m).dmg"
          ls -la "$DMG"
          HEX=$(shasum -a 256 "$DMG" | cut -c1-64)
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "DMG_HEX=$HEX" >> "$GITHUB_ENV"
          echo "dmg sha256: $HEX"
          brew install syft trivy

      - name: sbom
        working-directory: src
        run: cilock run --no-product-binding --enable-archivista --step sbom -a "$ATTESTORS,sbom" -o "$EVID/sbom.att.json" -- syft dir:build/macosx/package -o spdx-json=build/macosx/darktable.spdx.json

      - name: scan
        working-directory: src
        run: cilock run --no-product-binding --enable-archivista --step scan -a "$ATTESTORS,trivy" --ignore-command-exit-code -o "$EVID/scan.att.json" -- trivy fs --scanners vuln --format json --output build/macosx/darktable.trivy.json build/macosx/package

      - name: summary
        if: always()
        run: |
          ls -la "$EVID" || true
          echo "dmg sha256: ${DMG_HEX:-unknown}"

      - name: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: darktable-macos-attested
          retention-days: 3
          path: |
            ${{ env.DMG }}
            ${{ env.EVID }}
            src/build/macosx/darktable.spdx.json
            src/build/macosx/darktable.trivy.json
