# Attested macOS build of darktable — experiment on a personal fork.
#
# Phase 1: the upstream nightly macOS job with every build step wrapped by the
# cilock CLI. Each step produces one signed record and uploads it to the
# TestifySec platform. Signing is keyless: inside GitHub Actions, cilock's
# Fulcio signer fetches this workflow's OIDC token itself, and Archivista
# upload auth uses the same OIDC identity (trusted with `cilock trust github`).
#
# Uses the CLI directly rather than aflock-ai/cilock-action: v4.x tags have no
# release binaries (404) and v3.0.8's shim fails on Node 24 (MODULE_NOT_FOUND).
# The CLI is also exactly what a Jenkins / TeamCity agent would run.
#
# Baseline (phase 0, no attestation): run 36046970463, 26m 13s total.
# Runs only on pushes to `attested-build` or by hand. Never touches tags or releases.

name: attested-macos

on:
  push:
    branches: [attested-build]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # keyless signing + platform upload with the workflow's OIDC token

jobs:
  macos:
    name: macOS arm64 (attested)
    runs-on: macos-15
    timeout-minutes: 240
    outputs:
      dmg_tag: ${{ steps.publish.outputs.dmg_tag }}
      dmg_hex: ${{ steps.publish.outputs.dmg_hex }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CC: cc
      CXX: c++
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      SRC_DIR: ${{ github.workspace }}/src
      BUILD_DIR: ${{ github.workspace }}/src/build
      INSTALL_PREFIX: ${{ github.workspace }}/src/build/macosx
      ECO: -DBINARY_PACKAGE_BUILD=ON -DBUILD_CURVE_TOOLS=ON -DBUILD_NOISE_TOOLS=ON -DUSE_GRAPHICSMAGICK=ON -DUSE_IMAGEMAGICK=OFF
      CMAKE_BUILD_TYPE: Release
      GENERATOR: Ninja
      TARGET: skiptest
      CILOCK_SKIP_VERSION_CHECK: "1"
      # Same attestors on every step; extras are appended per step.
      ATTESTORS: environment,git,github
      # --no-product-binding on every run: the hosted platform returns 401 on
      # /api/auth/resolve-binding for this repo's workflow login token (see plan log).
      EVID: ${{ github.workspace }}/evidence
    steps:
      - name: install cilock
        run: |
          mkdir -p "$HOME/.local/bin" "$EVID"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://cilock.dev/install.sh | CILOCK_BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cilock" version

      # Diagnostic: print the CLAIMS (never the token) of the workflow OIDC token for
      # each audience cilock uses, to compare with the `cilock trust` credential
      # (issuer token.actions.githubusercontent.com, subject repo:manzil-infinity180/darktable:*).
      - name: oidc claims
        run: |
          for aud in https://platform.testifysec.com/archivista https://platform.testifysec.com/login sigstore; do
            tok=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$aud" | jq -r .value)
            echo "== audience requested: $aud"
            echo "$tok" | cut -d. -f2 | tr '_-' '/+' | awk '{ l=length($0)%4; if(l==2)$0=$0"=="; else if(l==3)$0=$0"="; print }' \
              | base64 -d 2>/dev/null | jq '{iss, sub, aud, repository, repository_owner, ref, workflow_ref, job_workflow_ref}'
          done
          cilock login --workflow-identity 2>&1 | tail -5 || true

      # The clone itself cannot be attested by the git attestor (no repo exists
      # until it finishes). Every later step records the commit it built from.
      - name: clone
        run: git clone -b ${{ github.ref_name }} https://github.com/${{ github.repository }} src

      - name: source
        working-directory: src
        run: cilock run --no-product-binding --enable-archivista --step source -a "$ATTESTORS" -o "$EVID/source.att.json" -- bash .attest/source.sh

      - name: deps
        working-directory: src
        run: cilock run --no-product-binding --enable-archivista --step deps -a "$ATTESTORS" -o "$EVID/deps.att.json" -- bash .attest/deps.sh

      - name: build
        working-directory: src
        run: mkdir -p "$BUILD_DIR" "$INSTALL_PREFIX" && cilock run --no-product-binding --enable-archivista --step build -a "$ATTESTORS" -o "$EVID/build.att.json" -- sh -c './.ci/ci-script.sh > build/logs-build.txt 2>&1; rc=$?; tail -40 build/logs-build.txt; exit $rc'

      - name: app-bundle
        working-directory: src
        run: cilock run --no-product-binding --enable-archivista --step app-bundle -a "$ATTESTORS" -o "$EVID/app-bundle.att.json" -- sh -c './packaging/macosx/3_make_hb_darktable_package.sh > build/logs-app-bundle.txt 2>&1; rc=$?; tail -40 build/logs-app-bundle.txt; exit $rc'

      - name: dmg
        working-directory: src
        run: cilock run --no-product-binding --enable-archivista --step dmg -a "$ATTESTORS" -o "$EVID/dmg.att.json" -- sh -c './packaging/macosx/4_make_hb_darktable_dmg.sh > build/logs-dmg.txt 2>&1; rc=$?; tail -40 build/logs-dmg.txt; exit $rc'

      - name: locate dmg
        working-directory: src
        run: |
          VERSION=$(git describe --tags --match release-* | sed 's/^release-//;s/-/+/;s/-/~/;s/rc/~rc/')
          DMG="${INSTALL_PREFIX}/darktable-${VERSION}-$(uname -m).dmg"
          ls -la "$DMG"
          HEX=$(shasum -a 256 "$DMG" | cut -c1-64)
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "DMG_HEX=$HEX" >> "$GITHUB_ENV"
          echo "dmg sha256: $HEX"
          # OCI tags cannot contain '+' or '~', so tag by short commit instead of VERSION.
          echo "DMG_TAG=nightly-$(git rev-parse --short=10 HEAD)-$(uname -m)" >> "$GITHUB_ENV"
          brew install syft trivy oras

      - name: sbom
        working-directory: src
        run: cilock run --no-product-binding --enable-archivista --step sbom -a "$ATTESTORS,sbom" -o "$EVID/sbom.att.json" -- syft dir:build/macosx/package -o spdx-json=build/macosx/darktable.spdx.json

      - name: scan
        working-directory: src
        run: cilock run --no-product-binding --enable-archivista --step scan -a "$ATTESTORS,trivy" --ignore-command-exit-code -o "$EVID/scan.att.json" -- trivy fs --scanners vuln --format json --output build/macosx/darktable.trivy.json build/macosx/package

      # --- Phase 2: bundle every record linked to the .dmg, store both in JFrog ---
      - name: bundle
        run: |
          # Preferred: ask the platform for every record of THIS commit (what a release
          # gate would do). Three workarounds, each found by testing locally first:
          #  - bundle create reads with a stored `cilock login` token or --archivista-headers
          #    only; CI has neither, so mint the workflow OIDC token for the archivista
          #    audience (the trusted credential carries attestation:read) and pass it.
          #  - the platform stores subject digests as bare hex, so a `sha256:`/`sha1:`
          #    prefixed seed matches nothing: seed with the bare commit hash.
          #  - the default walk (depth 5) hops through shared subjects into other runs
          #    (146 records locally); depth 1 is exactly this commit's records.
          TOK=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://platform.testifysec.com/archivista" | jq -r .value)
          echo "::add-mask::$TOK"
          COMMIT=$(git -C "$SRC_DIR" rev-parse HEAD)
          if cilock bundle create --max-depth 1 -s "$COMMIT" \
               --archivista-headers "Authorization: Bearer $TOK" \
               -o "$EVID/darktable-bundle.tar.gz" \
             && cilock bundle inspect "$EVID/darktable-bundle.tar.gz" | grep -q 'envelopes: [1-9]'; then
            echo "BUNDLE_SOURCE=platform" >> "$GITHUB_ENV"
            cilock bundle inspect "$EVID/darktable-bundle.tar.gz" || true
          else
            # Fallback: the envelopes this job just wrote, plus their inventories.
            echo "::warning::cilock bundle create found nothing for sha256:${DMG_HEX}; bundling local envelopes instead"
            tar czf "$EVID/darktable-bundle.tar.gz" -C "$EVID" $(cd "$EVID" && ls *.att.json *-inventory.json 2>/dev/null)
            echo "BUNDLE_SOURCE=local" >> "$GITHUB_ENV"
          fi
          ls -la "$EVID/darktable-bundle.tar.gz"
          echo "bundle sha256: $(shasum -a 256 "$EVID/darktable-bundle.tar.gz" | cut -c1-64)"

      - name: publish to jfrog
        id: publish
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
          REG: trialf8c48c.jfrog.io
          REPO: trialf8c48c.jfrog.io/docker-trial/darktable
        run: |
          printf '%s' "$JFROG_TOKEN" | oras login "$REG" -u "$JFROG_USER" --password-stdin
          # The installer, as an OCI artifact under a readable tag.
          ( cd "$(dirname "$DMG")" && oras push "$REPO:$DMG_TAG" \
              --artifact-type application/vnd.darktable.dmg.v1 \
              "$(basename "$DMG"):application/x-apple-diskimage" )
          # The evidence, filed under the installer's own fingerprint: the bundle
          # plus every envelope and inventory, so a downloader can use either.
          ( cd "$EVID" && oras push "$REPO:sha256-${DMG_HEX}.att" \
              --artifact-type application/vnd.cilock.evidence.v1 \
              darktable-bundle.tar.gz:application/vnd.cilock.bundle.v1+gzip \
              $(ls *.att.json | sed 's/$/:application\/vnd.dsse.envelope.v1+json/') \
              $(ls *-inventory.json 2>/dev/null | sed 's/$/:application\/json/') )
          oras repo tags "$REPO"
          echo "dmg_tag=$DMG_TAG" >> "$GITHUB_OUTPUT"
          echo "dmg_hex=$DMG_HEX" >> "$GITHUB_OUTPUT"

      - name: summary
        if: always()
        run: |
          ls -la "$EVID" || true
          echo "dmg sha256: ${DMG_HEX:-unknown}"
          echo "dmg tag:    ${DMG_TAG:-unknown}"
          echo "bundle:     ${BUNDLE_SOURCE:-not built}"

      - name: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: darktable-macos-attested
          retention-days: 3
          path: |
            ${{ env.DMG }}
            ${{ env.EVID }}
            src/build/macosx/darktable.spdx.json
            src/build/macosx/darktable.trivy.json

  # --- Phase 2/3: a downloader on a clean machine. It knows only the installer's
  # tag. It pulls the .dmg, fingerprints it, finds the evidence BY that
  # fingerprint, and checks every signed record binds to the same commit and
  # that the chain covers every step. (Policy-based `cilock verify` is phase 3.)
  downloader:
    name: download from JFrog and check
    needs: macos
    runs-on: ubuntu-latest
    env:
      REG: trialf8c48c.jfrog.io
      REPO: trialf8c48c.jfrog.io/docker-trial/darktable
      DMG_TAG: ${{ needs.macos.outputs.dmg_tag }}
      CILOCK_SKIP_VERSION_CHECK: "1"
    steps:
      - name: tools
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://cilock.dev/install.sh | CILOCK_BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ORAS_VERSION=1.2.3
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" | tar xz -C "$HOME/.local/bin" oras

      - name: pull installer and evidence
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          printf '%s' "$JFROG_TOKEN" | oras login "$REG" -u "$JFROG_USER" --password-stdin
          mkdir -p download/evidence
          ( cd download && oras pull "$REPO:$DMG_TAG" )
          DMG=$(ls download/*.dmg)
          HEX=$(sha256sum "$DMG" | cut -c1-64)
          echo "downloaded: $DMG"
          echo "sha256:     $HEX"
          [ "$HEX" = "${{ needs.macos.outputs.dmg_hex }}" ] && echo "matches what CI built" || { echo "::error::digest mismatch"; exit 1; }
          # Derive the evidence tag from the file's own hash. No lookup service.
          ( cd download/evidence && oras pull "$REPO:sha256-${HEX}.att" )
          ls -la download/evidence
          echo "HEX=$HEX" >> "$GITHUB_ENV"

      - name: check the evidence
        run: |
          cd download/evidence
          cilock bundle inspect darktable-bundle.tar.gz || echo "(bundle is the local fallback, not a platform bundle)"
          echo
          printf '%-12s %-10s %-42s %s\n' STEP SIGNER COMMIT "EXIT"
          for f in *.att.json; do
            step=$(jq -r .payload "$f" | base64 -d | jq -r .predicate.name)
            commit=$(jq -r .payload "$f" | base64 -d | jq -r '[.subject[].name | select(test("commithash:"))][0] | sub(".*commithash:";"")')
            exitc=$(jq -r .payload "$f" | base64 -d | jq -r '[.predicate.attestations[] | select(.type|test("command-run")) | .attestation.exitcode][0]')
            signer=$(jq -r '.signatures[0].certificate // "key"' "$f" | head -c 12)
            printf '%-12s %-10s %-42s %s\n' "$step" "${signer:+cert}" "$commit" "$exitc"
          done
          echo
          commits=$(for f in *.att.json; do jq -r .payload "$f" | base64 -d | jq -r '[.subject[].name | select(test("commithash:"))][0]'; done | sort -u | wc -l)
          [ "$commits" = "1" ] && echo "every record names the same commit" || { echo "::error::records name $commits different commits"; exit 1; }
          for s in source deps build app-bundle dmg sbom scan; do
            [ -f "$s.att.json" ] || { echo "::error::missing record for step $s"; exit 1; }
          done
          echo "all 7 steps present"
