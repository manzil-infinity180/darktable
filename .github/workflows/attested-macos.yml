# Attested macOS build of darktable — experiment on a personal fork.
#
# Phase 1: the upstream nightly macOS job, with every build step wrapped by
# cilock-action. Each step produces one signed record (keyless, signed with this
# workflow's GitHub OIDC identity via the platform's Fulcio) and uploads it to
# the TestifySec platform under product `darktable`. SBOM and vulnerability
# scan steps are added after packaging.
#
# Baseline (phase 0, no attestation) was run 36046970463: 26m 13s total.
#
# Runs only on pushes to `attested-build` or by hand. Never touches tags or
# releases (unlike upstream nightly.yml's upload_to_release job).

name: attested-macos

on:
  push:
    branches: [attested-build]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # keyless signing + platform upload with the workflow's OIDC token

jobs:
  macos:
    name: macOS arm64 (attested)
    runs-on: macos-15
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CC: cc
      CXX: c++
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      SRC_DIR: ${{ github.workspace }}/src
      BUILD_DIR: ${{ github.workspace }}/src/build
      INSTALL_PREFIX: ${{ github.workspace }}/src/build/macosx
      ECO: -DBINARY_PACKAGE_BUILD=ON -DBUILD_CURVE_TOOLS=ON -DBUILD_NOISE_TOOLS=ON -DUSE_GRAPHICSMAGICK=ON -DUSE_IMAGEMAGICK=OFF
      CMAKE_BUILD_TYPE: Release
      GENERATOR: Ninja
      TARGET: skiptest
    steps:
      # The clone itself cannot be attested by the git attestor (there is no repo
      # until it finishes). Every later step records the commit it built from.
      - name: clone
        run: git clone -b ${{ github.ref_name }} https://github.com/${{ github.repository }} src

      - name: source
        uses: aflock-ai/cilock-action@v4.5.0
        with:
          step: source
          workingdir: src
          attestations: "environment git github"
          command: "bash .attest/source.sh"

      - name: deps
        uses: aflock-ai/cilock-action@v4.5.0
        with:
          step: deps
          workingdir: src
          attestations: "environment git github"
          command: "bash .attest/deps.sh"

      - name: build
        uses: aflock-ai/cilock-action@v4.5.0
        with:
          step: build
          workingdir: src
          attestations: "environment git github"
          command: "./.ci/ci-script.sh"

      - name: app-bundle
        uses: aflock-ai/cilock-action@v4.5.0
        with:
          step: app-bundle
          workingdir: src
          attestations: "environment git github"
          command: "./packaging/macosx/3_make_hb_darktable_package.sh"

      - name: dmg
        uses: aflock-ai/cilock-action@v4.5.0
        with:
          step: dmg
          workingdir: src
          attestations: "environment git github"
          command: "./packaging/macosx/4_make_hb_darktable_dmg.sh"

      - name: locate dmg
        run: |
          cd "${SRC_DIR}"
          VERSION=$(git describe --tags --match release-* | sed 's/^release-//;s/-/+/;s/-/~/;s/rc/~rc/')
          DMG="${INSTALL_PREFIX}/darktable-${VERSION}-$(uname -m).dmg"
          ls -la "$DMG"
          HEX=$(shasum -a 256 "$DMG" | cut -c1-64)
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "DMG_HEX=$HEX" >> "$GITHUB_ENV"
          echo "dmg sha256: $HEX"
          brew install syft trivy

      # SBOM + scan name the .dmg explicitly as a subject, so the platform's
      # subject graph links them to the installer (for `cilock bundle create`).
      - name: sbom
        uses: aflock-ai/cilock-action@v4.5.0
        with:
          step: sbom
          workingdir: src
          attestations: "environment git github sbom"
          subjects: "darktable-dmg=sha256:${{ env.DMG_HEX }}"
          command: "syft dir:build/macosx/package -o spdx-json=build/macosx/darktable.spdx.json"

      - name: scan
        uses: aflock-ai/cilock-action@v4.5.0
        with:
          step: scan
          workingdir: src
          attestations: "environment git github trivy"
          subjects: "darktable-dmg=sha256:${{ env.DMG_HEX }}"
          cilock-args: "--ignore-command-exit-code"
          command: "trivy fs --scanners vuln --format json --output build/macosx/darktable.trivy.json build/macosx/package"

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: darktable-macos-attested
          retention-days: 3
          path: |
            ${{ env.DMG }}
            src/build/macosx/darktable.spdx.json
            src/build/macosx/darktable.trivy.json
